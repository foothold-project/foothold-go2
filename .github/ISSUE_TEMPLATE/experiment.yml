name: 실험
description: 가설 하나, 변경 하나. 기준선과 대조해 숫자로 판정한다.
title: "[실험] "
labels: [experiment]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: 가설
      description: 무엇을 바꾸면 무엇이 어떻게 될 것이다 — 한 문장.
      placeholder: 발 들어올림 보상 계수를 0.5에서 1.0으로 올리면 계단 통과율이 오를 것이다
    validations:
      required: true
  - type: input
    id: change
    attributes:
      label: 바꾸는 것 — 반드시 하나
      description: 두 개를 바꾸면 어느 쪽 효과인지 알 수 없다.
      placeholder: reward.feet_clearance.weight = 1.0
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: 대조할 기준선
      description: EXPERIMENTS.md 의 실험 번호.
      placeholder: "#0 (NVIDIA 공개 체크포인트) 또는 #3"
    validations:
      required: true
  - type: textarea
    id: metric
    attributes:
      label: 판정 지표와 통과선
      description: 돌리기 전에 정한다. 결과를 보고 기준을 바꾸면 실증이 아니다.
      placeholder: |
        지표: 계단 지형 통과율 (100회 자동 평가)
        통과선: 기준선 대비 +5%p 이상이면 채택, 미만이면 폐기
    validations:
      required: true
  - type: input
    id: cost
    attributes:
      label: 예상 비용
      description: 1,500 iteration = 약 113분 (RTX 5080 1장 실측)
      placeholder: 2시간 / GPU 1장
  - type: checkboxes
    id: after
    attributes:
      label: 마칠 때
      options:
        - label: EXPERIMENTS.md 에 결과 한 줄 추가 (채택이든 폐기든)
          required: true
        - label: 설정 파일을 configs/ 에 실험 번호로 저장
          required: true
  - type: dropdown
    id: quest
    attributes:
      label: 어느 퀘스트의 일인가
      description: "설계도 §3 퀘스트 보드. 완료 조건은 거기에 있다: https://foothold-project.vercel.app/plan.html"
      options:
        - "Q0 개발환경 구축 (② 기준)"
        - "Q1 거북이 조종하기 · ROS 입문 (② 기준)"
        - "Q2 남의 정책 재생 (② 기준)"
        - "Q3 첫 기록 재기 (② 기준)"
        - "Q4 지형 조각 1개 (③ 환경)"
        - "Q5 계곡형 지형 조합 (③ 환경)"
        - "Q6 문제를 숫자로 (③ 환경)"
        - "Q7 학습 1회 완주 (④ 학습)"
        - "Q8 기록 갱신 (⑤ 평가)"
        - "Q9 다른 세계에서도 · sim2sim (⑥ 전이)"
        - "Q10 계약서 검증 · 정합성 6종 (⑥ 전이)"
        - "Q11 로봇과 첫 대화 · ROS2 (⑥ 전이)"
        - "Q12 실기 첫 걸음 · 안전 사다리 (⑥ 전이)"
        - "보스전 실기 험지 10m + 갭 리포트 (⑦ 적응)"
        - "현장·장비 조사 (① 관측)"
        - "운영 문서 · 회의 · 인프라"
    validations:
      required: true
