name: 실험 기록
description: 가설 하나, 변경 하나. 결과는 숫자로 판정합니다.
title: "[실험] "
labels: [experiment]
type: Task
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: 무엇을 바꾸면 무엇이 좋아지나
      description: 바꾸는 것은 반드시 하나. 판정 기준(어떤 숫자를 보나)까지 적으면 더 좋습니다.
      placeholder: |
        마찰 랜덤화 범위를 0.4~1.2 → 0.2~1.4 로 넓히면 통과율이 오를 것이다.
        (판정: 기준선 86.7% 대비 통과율)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      description: 이 이슈가 프로젝트의 어느 축에 속하는지 고릅니다. 애매하면 C/운영.
      options:
        - "A/정책학습 · 학습 · 보상 · 관측 · 파인튜닝"
        - "A/지형씬제작 · 지형과 씬 에셋 제작"
        - "A/평가 · 일반화 벤치마크 · 지표"
        - "A/트윈렌더 · 실공간 복원 · 3DGS · 렌더 · 합성데이터"
        - "B/항법 · ROS2 · TF · SLAM · Nav2"
        - "B/인지 · LiDAR · 카메라 · 센서 융합"
        - "C/기록 · 회의록 · 문서 · 백과 · 커리큘럼 · 발표"
        - "C/운영 · 인프라 · 자동화 · 깃 · 웹 · 예산 · 일정"
  - type: dropdown
    id: gate
    attributes:
      label: 어느 관문까지
      description: 이 일이 끝나야 하는 발표 관문입니다. 모르면 비워 두세요.
      options:
        - "A-정책 · 9월 12일"
        - "MVP · 중간발표 · 9월 30일"
        - "NAV · 실기 항법 · 11월 7일"
        - "FINAL · 최종발표 · 12월 11일"
  - type: textarea
    id: memo
    attributes:
      label: 메모 (선택)
      description: 예상 비용(학습 1회 약 2시간 15분), 참고. 비워도 됩니다.
